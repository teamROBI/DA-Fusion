# Base config for DA-Fusion (Swin-L, dual-branch DS/DC fusion, Mask2Former decoder).
# Self-contained (no _BASE_ chain into upstream Mask2Former) — everything the model
# needs is set here; task configs inherit this file.
MODEL:
  META_ARCHITECTURE: "DAFusion"
  BACKBONE:
    NAME: "build_dafusion_backbone"
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  SWIN:
    EMBED_DIM: 192
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [6, 12, 24, 48]
    WINDOW_SIZE: 12
    PRETRAIN_IMG_SIZE: 384
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 1
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10   # 9 decoder layers + 1
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OBJECT_MASK_THRESHOLD: 0.8
      OVERLAP_THRESHOLD: 0.8
      SEM_SEG_POSTPROCESSING_BEFORE_INFERENCE: False
  DAFUSION:
    INPUT_TYPE: "rgbd"
    NUM_HEADS: 8
    N_GROUPS: 4
    OFFSET_RANGE_FACTOR: 2.0
    USE_RPB: True
    STRIDES: [8, 4, 2, 1]
SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.0001
  MAX_ITER: 500000
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 4000
  LR_SCHEDULER_NAME: "WarmupCosineLR"
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 0.1
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
  CHECKPOINT_PERIOD: 5000
INPUT:
  INPUT_TYPE: "rgbd"
  DEPTH_ENCODING: "normalized"   # matches the legacy build; "hha" is available but needs an intrinsic
  DEPTH_INVERTED: True
  AUGMENTATION: True
  DATASET_MAPPER_NAME: "dafusion_mapper"
  IMAGE_SIZE: 640
  MIN_SCALE: 0.5
  MAX_SCALE: 1.5
  FORMAT: "RGB"
TEST:
  EVAL_PERIOD: 0
  DETECTIONS_PER_IMAGE: 100
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4
VERSION: 2
