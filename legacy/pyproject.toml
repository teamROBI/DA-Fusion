[project]
name = "dafusion-legacy"
version = "0.1.0"
description = "DA-Fusion LEGACY build (Mask2Former-fork CFS late-fusion). The real DS/DC reimplementation lives in ../dafusion/."
requires-python = ">=3.8,<3.9"

# NOTE: torch/torchvision (cu111) and the vendored detectron2 are installed
# separately in scripts/setup_env.sh (they need a custom index / editable install
# and must stay paired). Everything else the project needs is listed here.
# Versions pinned to the original working run (core/wandb snapshot).
dependencies = [
    "numpy==1.24.4",
    "opencv-python==4.9.0.80",
    "pillow==9.3.0",
    "scipy==1.10.1",
    "scikit-image==0.21.0",
    "shapely==2.0.3",
    "timm==0.9.12",
    "h5py==3.10.0",
    "submitit==1.5.1",
    "imageio==2.34.0",
    "termcolor==2.4.0",
    "tqdm==4.66.2",
    "cython==3.0.8",
    "wandb==0.16.3",
    "tensorboard==2.14.0",
    "pycocotools==2.0.7",
    "cityscapesscripts==2.2.2",
    "fvcore==0.1.5.post20221221",
    "iopath==0.1.9",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "yacs==0.1.8",
    "matplotlib==3.7.5",
    "pyfastnoisesimd==0.4.2",
    "pyquaternion==0.9.9",
]

[tool.setuptools]
# This build is run as scripts (legacy/ is the cwd for the run scripts),
# not imported as an installed package; don't try to autodiscover packages.
py-modules = []

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
